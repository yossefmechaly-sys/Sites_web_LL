# Site Jerusalem FC — à copier dans /etc/nginx/sites-available/jerusalemfc puis activer :
#   sudo ln -s /etc/nginx/sites-available/jerusalemfc /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Le HTTPS est ensuite ajouté par Certbot (voir DEPLOIEMENT.md), qui complète ce fichier.

# www → domaine principal
server {
    listen 80;
    listen [::]:80;
    server_name www.jerusalemfc.co.il;
    return 301 https://jerusalemfc.co.il$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name jerusalemfc.co.il;

    # Envoi de photos depuis l'admin
    client_max_body_size 20m;

    # Compression des pages et du JSON (les images sont déjà compressées)
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Fichiers de build Next.js : immuables, cache 1 an
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }

    # Point d'entrée réservé à la tâche planifiée locale (vidage du cache après import)
    location /revalidate {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://127.0.0.1:3100;
    }
}
