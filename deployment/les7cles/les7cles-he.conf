<VirtualHost *:80>
    ServerName xn-----xldnbaepd2cbs3c5a9azbtec.tobedev.com
    DocumentRoot /mnt/bigdata/les7cles/he
    DirectoryIndex index.html

    RewriteEngine On
    RewriteRule ^/?contact[.]php(?:/.*)?$ - [R=503,L,NC]

    <Directory /mnt/bigdata/les7cles/he>
        Options -Indexes -MultiViews -ExecCGI
        AllowOverride None
        Require all granted
        <FilesMatch "(?i:\.(?:php[0-9]?|phtml|phar)(?:[.~].*)?$)">
            Require all denied
        </FilesMatch>
        <FilesMatch "^\.">
            Require all denied
        </FilesMatch>
    </Directory>

    ErrorDocument 404 /404.html
    Header always set X-Robots-Tag "noindex, nofollow"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    AddOutputFilterByType SUBSTITUTE text/html application/xml text/xml text/plain
    SubstituteMaxLineLength 4m
    Substitute "s|https://les7cles.com/|https://les7cles.tobedev.com/|n"
    Substitute "s|https://thesevenkeystosucceed.com/|https://thesevenkeystosucceed.tobedev.com/|n"
    Substitute "s|https://xn-----xldnbaepd2cbs3c5a9azbtec.co.il/|https://xn-----xldnbaepd2cbs3c5a9azbtec.tobedev.com/|n"

    <FilesMatch "\.(?:html|xml|txt)$">
        Header set Cache-Control "no-cache"
    </FilesMatch>
    <FilesMatch "\.(?:webp|png|jpe?g|svg|woff2?|css|js)$">
        Header set Cache-Control "public, max-age=3600"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/les7cles-he-error.log
    CustomLog ${APACHE_LOG_DIR}/les7cles-he-access.log combined
</VirtualHost>
