<VirtualHost *:80>
    ServerName jerusalemfc.tobedev.com
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "expr=%{REQUEST_SCHEME}"
    LimitRequestBody 20971520

    <Location "/revalidate">
        Require all denied
    </Location>

    ProxyPass / http://127.0.0.1:3100/ connectiontimeout=5 timeout=60
    ProxyPassReverse / http://127.0.0.1:3100/
    ErrorLog ${APACHE_LOG_DIR}/jerusalemfc-error.log
    CustomLog ${APACHE_LOG_DIR}/jerusalemfc-access.log combined
</VirtualHost>
