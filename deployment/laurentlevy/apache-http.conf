<VirtualHost *:80>
    ServerName laurent-levy.tobedev.com

    # Laurent Levy production redirect; existing API and PHP are retained.
    RewriteEngine On
    RewriteCond %{REQUEST_METHOD} ^(?:GET|HEAD)$
    RewriteCond %{REQUEST_URI} !^/api(?:/|$) [NC]
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^/(.*)$ https://laurent-levy.com/$1 [R=301,END]

    DocumentRoot /mnt/bigdata/laurentlevy/site
    DirectoryIndex index.html

    RewriteEngine On
    RewriteRule ^/?api/contact/?$ /api/contact.php [PT,L]
    <Location "/api/contact.php">
        SetHandler "proxy:unix:/run/php/php8.5-fpm.sock|fcgi://localhost"
    </Location>

    <Directory /mnt/bigdata/laurentlevy/site>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
    </Directory>

    ErrorDocument 404 /404.html

    AddOutputFilterByType SUBSTITUTE text/html application/xml text/xml text/plain
    SubstituteMaxLineLength 4m
    Substitute "s|https://www.laurent-levy.com|https://laurent-levy.tobedev.com|n"

    <Location /_astro/>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Location>

    <FilesMatch "\.(html|xml|txt|webmanifest)$">
        Header set Cache-Control "public, max-age=0, must-revalidate"
    </FilesMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

    ErrorLog ${APACHE_LOG_DIR}/laurentlevy-error.log
    CustomLog ${APACHE_LOG_DIR}/laurentlevy-access.log combined
RewriteCond %{SERVER_NAME} =laurent-levy.tobedev.com
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
