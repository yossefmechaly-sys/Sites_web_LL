# laurent-levy.com — règles Apache communes (à inclure dans le vhost du site : `Include /etc/apache2/laurent-levy-rules.conf`).
# Équivalent Apache de deploy/cloudfront-function.js + des en-têtes de deploy/infrastructure.yml.
# Modules requis : rewrite, headers (déjà actifs sur le serveur). Contexte : <VirtualHost> uniquement
# (les motifs commencent par « / »). Testé par tests/apache.test.mjs (Apache 2.4 officiel sous Docker).

RewriteEngine On

# --- 1. Domaine canonique : www.laurent-levy.com -> laurent-levy.com -------------------------------------------------
RewriteCond %{HTTP_HOST} "^www\.laurent-levy\.com(?::[0-9]+)?$" [NC]
RewriteRule "^" "https://laurent-levy.com%{REQUEST_URI}" [R=301,L,NE]

# --- 2. Racine « / » : langue du navigateur (première langue parmi fr / en / he, fr par défaut) ---------------------
RewriteCond %{HTTP:Accept-Language} "^(?:(?!\s*(?:fr|en)\b)[^,]*,\s*)*\s*(?:he|iw)\b" [NC]
RewriteRule "^/(?:index\.html)?$" "/he/" [R=302,L]
RewriteCond %{HTTP:Accept-Language} "^(?:(?!\s*(?:fr|he|iw)\b)[^,]*,\s*)*\s*en\b" [NC]
RewriteRule "^/(?:index\.html)?$" "/en/" [R=302,L]
RewriteRule "^/(?:index\.html)?$" "/fr/" [R=302,L]

# --- 3. Anciennes URL WordPress -> accueil de la langue (301) ----------------------------------------------------------
RewriteRule "^/fr/en/?$" "/en/" [R=301,L]
RewriteRule "^/fr/he/?$" "/he/" [R=301,L]
RewriteRule "^/(fr|en|he)/(?:author|category|tag|meetup|portfolio-items|feed|comments|wp-json|page)(?:/.*)?$" "/$1/" [R=301,L]
RewriteRule "^/(en|he)/[0-9]{4}/[0-9]{2}/[0-9]{2}/[^/]+/?$" "/$1/" [R=301,L]
RewriteRule "^/fr/(?:25-best-horror-books|istanbul-travel-guide|whats-on-your-booklist|20-creativity-tips|bonjour-tout-le-monde)/?$" "/fr/" [R=301,L]
RewriteRule "^/(fr|en|he)/(?:wp-login\.php|wp-admin|xmlrpc\.php)(?:/.*)?$" "/$1/" [R=301,L]
# anciens plans de site Yoast -> nouveau sitemap
RewriteRule "^/(?:fr|en|he)/[a-z_-]*sitemap[a-z_-]*\.xml$" "/sitemap.xml" [R=301,L]
# anciens médias WordPress : définitivement supprimés (410)
RewriteRule "^/(?:fr|en|he)/wp-(?:content|includes)/" - [G,L]

# --- 4. En-têtes de sécurité (mêmes valeurs que deploy/headers.mjs et que CloudFront) -----------------------------------
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
Header always set Cross-Origin-Opener-Policy "same-origin"
Header always set Cross-Origin-Resource-Policy "same-origin"
Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
# HSTS : un an, sans includeSubDomains ni preload (à durcir plus tard quand tous les sous-domaines seront en HTTPS)
Header always set Strict-Transport-Security "max-age=31536000" "expr=%{HTTPS} == 'on'"

# --- 5. Cache : fichiers à empreinte (/_astro/) 1 an, le reste toujours revalidé ------------------------------------------
<LocationMatch "^/_astro/">
    Header set Cache-Control "public, max-age=31536000, immutable"
</LocationMatch>
<FilesMatch "\.(html|xml|txt|webmanifest|ico)$">
    Header set Cache-Control "public, max-age=0, must-revalidate"
</FilesMatch>
<If "%{REQUEST_URI} =~ m#^/(index\.html)?$#">
    Header always merge Vary Accept-Language
    Header always set Cache-Control "private, max-age=0"
</If>

ErrorDocument 404 /404.html
