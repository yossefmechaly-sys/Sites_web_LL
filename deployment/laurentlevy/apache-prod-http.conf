# Modèle de vhost pour le vrai domaine (à copier dans /etc/apache2/sites-available/laurentlevy-prod.conf).
# Rien ne l'active tant que `a2ensite laurentlevy-prod` n'est pas lancé. Procédure : INSTALLATION-APACHE.md.
# Ce vhost est distinct de celui de l'URL de dev (laurentlevy.conf) : il n'a PAS la règle « Substitute » qui réécrit le domaine.

<VirtualHost *:80>
    ServerName laurent-levy.com
    ServerAlias www.laurent-levy.com

    RewriteEngine On
    RewriteRule "^/?\.well-known/acme-challenge/" "-" [END]

    DocumentRoot /mnt/bigdata/laurentlevy/site-prod
    DirectoryIndex index.html

    <Directory /mnt/bigdata/laurentlevy/site-prod>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
    </Directory>

    # Formulaire de contact : script PHP unique (api/contact.php), identifiants dans /etc/laurent-levy/contact.ini
    # (installés pour l'URL de dev : voir deploy/php/INSTALLATION-SERVEUR.md). Cette règle doit rester AVANT l'Include.
    RewriteEngine On
    RewriteRule "^/?api/contact/?$" /api/contact.php [PT,L]
    <Location "/api/contact.php">
        SetHandler "proxy:unix:/run/php/php8.5-fpm.sock|fcgi://localhost"
    </Location>

    # Redirections, langue du navigateur, en-têtes de sécurité, cache (testées : tests/apache.test.mjs)
    AddOutputFilterByType SUBSTITUTE text/html application/xml text/xml text/plain
    SubstituteMaxLineLength 4m
    Substitute "s|https://www.laurent-levy.com/|https://laurent-levy.com/|n"
    Substitute "s|https://laurent-levy.tobedev.com/|https://laurent-levy.com/|n"
    Header always unset X-Robots-Tag


    ErrorLog ${APACHE_LOG_DIR}/laurentlevy-prod-error.log
    CustomLog ${APACHE_LOG_DIR}/laurentlevy-prod-access.log combined
RewriteCond %{SERVER_NAME} =www.laurent-levy.com [OR]
RewriteCond %{SERVER_NAME} =laurent-levy.com
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

# Le vhost HTTPS (*:443) est créé par Certbot à partir de celui-ci (il en copie le contenu, Include compris) :
#   sudo certbot --apache -d www.laurent-levy.com -d laurent-levy.com
# Ensuite, retirer la ligne « Include … laurent-levy-rules.conf » du vhost *:80 (Certbot y met déjà la redirection vers HTTPS).
